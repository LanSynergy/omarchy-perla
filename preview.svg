<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a10"/>
      <stop offset="0.55" stop-color="#0c1019"/>
      <stop offset="1" stop-color="#090a0f"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#5be7ee" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5be7ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#ef72b6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ef72b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pearlText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ffff"/>
      <stop offset="0.45" stop-color="#75edf1"/>
      <stop offset="1" stop-color="#ef82be"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56dbe5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e978b4" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#c9e7f0" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="logoGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#5be7ee" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="270" cy="80" rx="520" ry="360" fill="url(#cyanGlow)"/>
  <ellipse cx="1440" cy="470" rx="500" ry="500" fill="url(#pinkGlow)"/>

  <g transform="translate(92 68)">
    <!-- The real raster orb is composited into preview.png after SVG rendering. -->
    <text x="98" y="33" font-family="SF Pro Display, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#f3f7fb">PERLA</text>
    <text x="98" y="62" font-family="SF Pro Display, Helvetica, sans-serif" font-size="16" font-weight="500" letter-spacing="2.4" fill="#84909e">FOR OMARCHY</text>
  </g>

  <g transform="translate(92 205)">
    <text x="0" y="0" font-family="SF Pro Display, Helvetica, sans-serif" font-size="94" font-weight="750" letter-spacing="-2" fill="#f4f7fb">GIVE OMARCHY</text>
    <text x="0" y="106" font-family="SF Pro Display, Helvetica, sans-serif" font-size="104" font-weight="780" letter-spacing="-2" fill="url(#pearlText)">A VOICE.</text>
    <text x="5" y="172" font-family="SF Pro Display, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#aeb8c5">Not dictation. Spoken intent becomes desktop action —</text>
    <text x="5" y="210" font-family="SF Pro Display, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#aeb8c5">and Omarchy talks back.</text>
  </g>

  <g transform="translate(92 526)" filter="url(#softShadow)">
    <g>
      <rect x="0" y="0" width="432" height="268" rx="25" fill="#111722" stroke="url(#cardStroke)" stroke-width="1.5"/>
      <circle cx="42" cy="43" r="17" fill="#5be7ee" fill-opacity="0.12" stroke="#64eaf0" stroke-opacity="0.5"/>
      <path d="M42 31a8 8 0 0 0-8 8v6a8 8 0 0 0 16 0v-6a8 8 0 0 0-8-8zm-13 14a13 13 0 0 0 26 0m-13 13v7" fill="none" stroke="#78edf1" stroke-width="2.2" stroke-linecap="round"/>
      <text x="72" y="50" font-family="SF Pro Display, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.3" fill="#72e8ee">YOU SAY</text>
      <text x="34" y="115" font-family="SF Pro Display, Helvetica, sans-serif" font-size="30" font-weight="650" fill="#f3f7fb">“Open Ghostty on</text>
      <text x="34" y="155" font-family="SF Pro Display, Helvetica, sans-serif" font-size="30" font-weight="650" fill="#f3f7fb">workspace 3.”</text>
      <text x="34" y="221" font-family="SF Pro Display, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#788493">Say the outcome, not every step.</text>
    </g>

    <g transform="translate(492 0)">
      <rect x="0" y="0" width="432" height="268" rx="25" fill="#111722" stroke="url(#cardStroke)" stroke-width="1.5"/>
      <circle cx="42" cy="43" r="17" fill="#7d8bff" fill-opacity="0.13" stroke="#929bff" stroke-opacity="0.5"/>
      <path d="M33 42h18M42 33v18" stroke="#aab0ff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="72" y="50" font-family="SF Pro Display, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.3" fill="#aab0ff">OMARCHY ACTS</text>
      <text x="34" y="112" font-family="SF Pro Display, Helvetica, sans-serif" font-size="25" font-weight="650" fill="#f3f7fb">Opens the app</text>
      <text x="34" y="151" font-family="SF Pro Display, Helvetica, sans-serif" font-size="25" font-weight="650" fill="#f3f7fb">Moves the window</text>
      <text x="34" y="190" font-family="SF Pro Display, Helvetica, sans-serif" font-size="25" font-weight="650" fill="#f3f7fb">Keeps working</text>
      <text x="34" y="229" font-family="SF Pro Display, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#788493">One request. Real desktop action.</text>
    </g>

    <g transform="translate(984 0)">
      <rect x="0" y="0" width="432" height="268" rx="25" fill="#111722" stroke="url(#cardStroke)" stroke-width="1.5"/>
      <circle cx="42" cy="43" r="17" fill="#ef72b6" fill-opacity="0.13" stroke="#ef82be" stroke-opacity="0.55"/>
      <path d="M33 47c4-9 14-9 18 0M35 39h14" fill="none" stroke="#f09ac9" stroke-width="2.2" stroke-linecap="round"/>
      <text x="72" y="50" font-family="SF Pro Display, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.1" fill="#ef93c5">PERLA TALKS BACK</text>
      <text x="34" y="115" font-family="SF Pro Display, Helvetica, sans-serif" font-size="30" font-weight="650" fill="#f3f7fb">“Done — Ghostty is</text>
      <text x="34" y="155" font-family="SF Pro Display, Helvetica, sans-serif" font-size="30" font-weight="650" fill="#f3f7fb">ready on workspace 3.”</text>
      <text x="34" y="221" font-family="SF Pro Display, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#788493">Your desktop answers you.</text>
    </g>
  </g>

  <g fill="none" stroke="#d9edf2" stroke-opacity="0.32" stroke-width="2">
    <path d="M535 660h37"/>
    <path d="M563 651l10 9-10 9"/>
    <path d="M1027 660h37"/>
    <path d="M1055 651l10 9-10 9"/>
  </g>

  <text x="1508" y="852" text-anchor="end" font-family="SF Pro Display, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="2.2" fill="#5c6673">CONVERSATIONAL CONTROL FOR OMARCHY</text>
</svg>
