name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test --locked --manifest-path perla-voice/Cargo.toml --workspace
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Harness tests
        run: |
          python -m pip install pytest ./omarchy-harness
          python -m pytest omarchy-harness/tests
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Plugin model tests
        run: node test-model.js
