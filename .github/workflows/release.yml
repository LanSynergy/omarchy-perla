name: Release

# Publishes the prebuilt perla-d that `bin/perla-setup` downloads, so a normal
# install is a few seconds instead of a Rust toolchain and a full compile.
# The tag must match the version in manifest.json — setup asks for exactly
# `v<manifest version>` and falls back to building from source if it is absent.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Built against the oldest glibc we support rather than the newest, so the
    # binary keeps working on a rolling Arch that is always further ahead.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest="$(jq -r .version manifest.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest.json version $manifest" >&2
            exit 1
          fi

      - name: Build perla-d
        run: |
          cargo build --locked --release \
            --manifest-path perla-voice/Cargo.toml \
            --bin perla-d

      - name: Package
        run: |
          target=x86_64-unknown-linux-gnu
          install -Dm755 perla-voice/target/release/perla-d dist/perla-d
          tar -czf "perla-d-$target.tar.gz" -C dist perla-d
          sha256sum "perla-d-$target.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            perla-d-x86_64-unknown-linux-gnu.tar.gz SHA256SUMS \
            || gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              perla-d-x86_64-unknown-linux-gnu.tar.gz SHA256SUMS

      - name: Keep the artifact on non-tag runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: perla-d-x86_64-unknown-linux-gnu
          path: |
            perla-d-x86_64-unknown-linux-gnu.tar.gz
            SHA256SUMS
