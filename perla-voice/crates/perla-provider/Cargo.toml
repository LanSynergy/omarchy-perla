[package]
name = "perla-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime voice providers for perla-voice: OpenAI Realtime / Grok over WebSocket"

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# rustls 0.23 ships no crypto provider unless a feature selects one, and
# tokio-tungstenite depends on it with default-features = false. Without this
# the first TLS handshake panics with "Could not automatically determine the
# process-level CryptoProvider". `ring` builds cleanly on aarch64.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
http = "1"

[dev-dependencies]
tokio = { workspace = true }
