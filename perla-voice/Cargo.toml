[workspace]
resolver = "2"
members = [
    "crates/perla-tools",
    "crates/perla-audio",
    "crates/perla-provider",
    "crates/perla-agents",
    "crates/perla-hands",
    "crates/perla-herdr",
    "crates/perla-core",
    "crates/perla-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/inawafalm/omarchy-perla"

[workspace.dependencies]
perla-tools = { path = "crates/perla-tools" }
perla-audio = { path = "crates/perla-audio" }
perla-provider = { path = "crates/perla-provider" }
perla-agents = { path = "crates/perla-agents" }
perla-hands = { path = "crates/perla-hands" }
perla-herdr = { path = "crates/perla-herdr" }
perla-core = { path = "crates/perla-core" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
toml = "0.8"
rand = "0.9"
ratatui = "0.29"
crossterm = "0.28"
